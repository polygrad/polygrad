<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>polygrad browser tests</title></head>
<body>
<pre id="log"></pre>
<script src="/dist/polygrad.js"></script>
<script src="/test/browser/tests.js"></script>
<script>
const log = document.getElementById('log')
const _origLog = console.log
console.log = function(...args) {
  log.textContent += args.join(' ') + '\n'
  _origLog.apply(console, args)
}

const params = new URLSearchParams(location.search)
const device = params.get('device') || 'auto'
const debugLevel = Number(params.get('debug') || 0) || 0
const isWebGpu = device === 'webgpu'
globalThis.__polygradDebugLevel = debugLevel

async function main() {
  console.log('=== device: ' + device + ' ===\n')

  let pg
  try {
    pg = await polygrad.create({ target: 'wasm', device: device })
  } catch (e) {
    console.log('FATAL: create failed: ' + e.message)
    window.__testResults = { passed: 0, failed: 1, error: e.message }
    return
  }

  // Run the full shared tensor test suite
  const tensorResult = await window.__runTests(pg)

  // Run instance tests (skip on WebGPU: no C vtable backend)
  let instanceResult = { passed: 0, failed: 0 }
  if (isWebGpu) {
    console.log('\n== Instance ==')
    console.log('  [SKIP] Instance tests (no WebGPU C backend)')
  } else {
    instanceResult = await window.__runInstanceTests(pg)
  }

  const totalPassed = tensorResult.passed + instanceResult.passed
  const totalFailed = tensorResult.failed + instanceResult.failed
  console.log('\nTotal: ' + totalPassed + ' passed, ' + totalFailed + ' failed')

  window.__testResults = {
    passed: totalPassed,
    failed: totalFailed,
    device: device
  }
}

main().catch(e => {
  console.log('FATAL: ' + e.message + '\n' + e.stack)
  window.__testResults = { passed: 0, failed: 1, error: e.message }
})
</script>
</body>
</html>
